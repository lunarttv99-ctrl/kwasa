<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kasa" />
  <title>Kasa dla osób</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Prywatny rejestr</p>
        <h1>Kasa dla osób</h1>
        <p class="subtitle">Zapisuj komu, ile i za co dałeś pieniądze. Dane zostają w pamięci telefonu.</p>
      </div>
      <button id="installBtn" class="ghost hidden" type="button">Zainstaluj</button>
    </header>

    <section class="stats" aria-label="Podsumowanie">
      <article>
        <span>Do oddania</span>
        <strong id="openTotal">0,00 zł</strong>
      </article>
      <article>
        <span>Rozliczone</span>
        <strong id="settledTotal">0,00 zł</strong>
      </article>
      <article>
        <span>Wpisów</span>
        <strong id="entryCount">0</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>Dodaj wpis</h2>
        <button id="clearFormBtn" class="text-btn" type="button">Wyczyść</button>
      </div>
      <form id="entryForm" autocomplete="off">
        <input type="hidden" id="entryId" />
        <label>
          Osoba
          <input id="person" name="person" type="text" placeholder="np. Bartek" required />
        </label>
        <label>
          Kwota
          <input id="amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="np. 50" required />
        </label>
        <label>
          Za co
          <input id="reason" name="reason" type="text" placeholder="np. paliwo, jedzenie, bilet" required />
        </label>
        <div class="two-cols">
          <label>
            Data
            <input id="date" name="date" type="date" required />
          </label>
          <label>
            Status
            <select id="status" name="status">
              <option value="open">Do oddania</option>
              <option value="settled">Rozliczone</option>
            </select>
          </label>
        </div>
        <label>
          Notatka
          <textarea id="note" name="note" rows="3" placeholder="Opcjonalnie"></textarea>
        </label>
        <button class="primary" type="submit">Zapisz wpis</button>
      </form>
    </section>

    <section class="panel tools">
      <div class="panel-title">
        <h2>Lista</h2>
        <button id="deleteAllBtn" class="danger-text" type="button">Usuń wszystko</button>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Szukaj osoby albo opisu" />
        <select id="filterStatus">
          <option value="all">Wszystkie</option>
          <option value="open">Do oddania</option>
          <option value="settled">Rozliczone</option>
        </select>
      </div>
      <div class="backup-actions">
        <button id="exportJsonBtn" class="ghost" type="button">Eksport JSON</button>
        <button id="exportCsvBtn" class="ghost" type="button">Eksport CSV</button>
        <label class="ghost import-label">
          Import JSON
          <input id="importJsonInput" type="file" accept="application/json" />
        </label>
      </div>
      <div id="peopleSummary" class="people-summary"></div>
      <div id="entries" class="entries"></div>
      <p id="emptyState" class="empty">Nie ma jeszcze żadnych wpisów.</p>
    </section>
  </main>

  <template id="entryTemplate">
    <article class="entry-card">
      <div class="entry-top">
        <div>
          <h3 class="entry-person"></h3>
          <p class="entry-reason"></p>
        </div>
        <strong class="entry-amount"></strong>
      </div>
      <p class="entry-note"></p>
      <div class="entry-meta">
        <span class="entry-date"></span>
        <span class="entry-status"></span>
      </div>
      <div class="entry-actions">
        <button class="settle-btn" type="button"></button>
        <button class="edit-btn" type="button">Edytuj</button>
        <button class="delete-btn" type="button">Usuń</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
